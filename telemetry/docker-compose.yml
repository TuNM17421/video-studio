services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - telemetry-postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./postgres/metrics.sql:/docker-entrypoint-initdb.d/002-metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: ./collector
    environment:
      PORT: 4318
      DATABASE_URL: postgresql://telemetry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/telemetry
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN in .env}
      AI_LOGS_ENABLED: ${AI_LOGS_ENABLED:-false}
      AI_LOG_ENCRYPTION_KEY: ${AI_LOG_ENCRYPTION_KEY:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-0}
      AI_LOG_RETENTION_DAYS: ${AI_LOG_RETENTION_DAYS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4318:4318"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - telemetry-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  telemetry-postgres:
  telemetry-grafana:
