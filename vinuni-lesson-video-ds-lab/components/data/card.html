<!-- @dsCard group="Components" viewport="700x360" name="Data · distributions, tokens, vectors, matrices" subtitle="ProbabilityBars reshaping with a Slider (holds at both extremes) · TokenChip · VectorColumn · Heatmap · MiniBar" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Data</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 360px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  VK.mountCard('#root', {
    width: 1400, height: 720, duration: 210,
    render: function (f) {
      var t = VK.interpolate(f, [30, 90, 150, 200], [0, 1, 1, 0], VK.CLAMP);
      var items = [
        { label: 'hoàn', value: 78 - 30 * t, highlight: true },
        { label: 'xử', value: 16 + 18 * t },
        { label: 'hỏi', value: 6 + 12 * t }
      ];
      return h(VK.Fragment, null,
        h(VK.ProbabilityBars, { x: 60, y: 110, items: items, max: 100, barW: 330, barH: 38, rowGap: 70, labelW: 110, size: 26, rounded: true, title: 'Khả năng token tiếp theo' }),
        h(VK.Slider, { x1: 190, x2: 500, y: 390, value: t, left: 'TẬP TRUNG', right: 'RỘNG', title: 'ĐỘ NGẪU NHIÊN (TEMPERATURE)' }),
        h(VK.TokenChip, { x: 60, y: 520, w: 130, h: 64, size: 28, text: 'Hôm' }),
        h(VK.TokenChip, { x: 205, y: 520, w: 130, h: 64, size: 28, text: 'nay' }),
        h(VK.TokenChip, { x: 350, y: 520, w: 130, h: 64, size: 28, text: 'trời' }),
        h(VK.TokenChip, { x: 495, y: 520, w: 130, h: 64, size: 28, text: 'mưa', selected: true, active: 1 }),
        h(VK.Bracket, { x: 60, y: 600, w: 420, h: 16 }),
        h(VK.SvgText, { x: 60, y: 660, size: 21, weight: 600, anchor: 'start', color: C.textMuted }, 'Tiền tố · phần văn bản đã có'),
        h(VK.VectorColumn, { x: 760, y: 110, values: ['0.2', '-0.1', '0.4'], highlight: 2, label: 'Vector minh họa' }),
        h(VK.Heatmap, {
          x: 980, y: 130, rows: 6, cols: 6, cell: 44, gap: 6,
          value: function (r, c) { return c > r ? 0 : 1 - (r - c) * 0.17; },
          rowLabels: ['Tôi', 'đi', 'học', 'ở', 'trường', 'xa'], colLabels: ['Tôi', 'đi', 'học', 'ở', 'trg', 'xa'], labelSize: 16
        }),
        h(VK.SvgText, { x: 1110, y: 470, size: 19, weight: 600, color: C.textMuted }, 'Heatmap · đỏ theo alpha'),
        h(VK.MiniBar, { x: 760, y: 580, w: 280, value: 0.7, label: 'Đạt tiêu chí · 7 ca' }),
        h(VK.MiniBar, { x: 760, y: 650, w: 280, value: 0.2, label: 'Thiếu ý · 2 ca', accent: C.red })
      );
    }
  });
</script>
</body>
</html>
