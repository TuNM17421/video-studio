<!-- @dsCard group="Iconography" viewport="700x300" name="Line icons" subtitle="20 hand-drawn icons · 64 grid · 3 px round stroke · currentColor · generic concepts only" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Line icons</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 300px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  VK.mountCard('#root', {
    width: 1400, height: 600, frame: 0,
    render: function () {
      var out = [];
      VK.ICON_NAMES.forEach(function (name, i) {
        var col = i % 10, row = Math.floor(i / 10);
        var x = 75 + col * 128, y = 70 + row * 170;
        out.push(h(VK.Icon, { key: name, name: name, x: x, y: y, size: 64, color: C.accent }));
        out.push(h(VK.SvgText, { key: name + '-t', x: x, y: y + 72, size: 17, weight: 600, color: C.textMuted }, name));
      });
      out.push(h('path', { key: 'rule', d: 'M 40 400 H 1360', stroke: C.dotInactive, strokeWidth: 2 }));
      out.push(h(VK.IconBadge, { key: 'b1', name: 'database', x: 110, y: 500, size: 110, color: C.accent }));
      out.push(h(VK.IconBadge, { key: 'b2', name: 'bulb', x: 260, y: 500, size: 110, color: C.red }));
      out.push(h(VK.IconBadge, { key: 'b3', name: 'neural-net', x: 410, y: 500, size: 110, color: C.accent, filled: true }));
      out.push(h('circle', { key: 'b4', cx: 560, cy: 500, r: 55, fill: C.bgAlt }));
      out.push(h(VK.Icon, { key: 'b4i', name: 'layers', x: 560, y: 500, size: 60, color: C.accentStrong }));
      out.push(h(VK.SvgText, { key: 'n1', x: 650, y: 470, size: 20, weight: 700, anchor: 'start', color: C.text }, 'accent mặc định · red = năng lực / nguy cơ'));
      out.push(h(VK.SvgText, { key: 'n2', x: 650, y: 505, size: 20, weight: 700, anchor: 'start', color: C.text }, 'trắng trên nền đặc · accentStrong trong thẻ tiêu đề'));
      out.push(h(VK.SvgText, { key: 'n3', x: 650, y: 545, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, 'Công nghệ có tên (Kafka, vLLM…) → logo chính thức.'));
      return out;
    }
  });
</script>
</body>
</html>
