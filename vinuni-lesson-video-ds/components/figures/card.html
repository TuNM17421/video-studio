<!-- @dsCard group="Components" viewport="700x300" name="Figures · người, phiếu, bong bóng, đồng hồ" subtitle="Person · DocumentSheet · FormSheet (ô trống = chưa đo) · SpeechBubble · Stopwatch — cho tình huống MINH HỌA" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Figures</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 300px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  VK.mountCard('#root', {
    width: 1400, height: 600, duration: 120,
    render: function (f) {
      return h(VK.Fragment, null,
        h(VK.Person, { x: 120, y: 150, r: 66, name: 'Học viên', role: 'tìm hướng dẫn' }),
        h(VK.Person, { x: 120, y: 420, r: 56, name: 'Người quan sát', active: true }),
        h(VK.DocumentSheet, { x: 270, y: 70, w: 190, label: 'Trang hướng dẫn', fill: VK.linearProgress(f, 10, 70) }),
        h(VK.FormSheet, { x: 520, y: 60, w: 520, labelW: 280, title: 'PHIẾU MÔ TẢ', rowH: 68, rows: [{ label: 'Ai gặp khó?' }, { label: 'Vướng bước nào?' }, { label: 'Chậm hoặc sai ở đâu?' }], active: 1 }),
        h(VK.SpeechBubble, { x: 270, y: 380, w: 380, h: 100, lines: ['Bước nào làm', 'bạn mất thời gian?'], tail: 'left' }),
        h(VK.Stopwatch, { x: 800, y: 440, sweep: VK.linearProgress(f, 0, 100), label: 'Hiện nay' }),
        h(VK.Stopwatch, { x: 1000, y: 440, sweep: 0.45, label: 'Mục tiêu', color: C.accent }),
        h(VK.SvgText, { x: 1080, y: 110, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, 'ô trống nét đứt'),
        h(VK.SvgText, { x: 1080, y: 138, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, '= chưa có số đo'),
        h(VK.SvgText, { x: 900, y: 578, size: 19, weight: 600, color: C.textMuted }, 'đồng hồ không có số')
      );
    }
  });
</script>
</body>
</html>
