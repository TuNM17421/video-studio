<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Beats</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 394px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 8px; }
  .frame { position: relative; width: 338px; height: 190px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--color-dot-inactive); }
</style>
</head>
<body>
<div class="grid">
  <div class="frame" id="hook"></div>
  <div class="frame" id="title"></div>
  <div class="frame" id="section"></div>
  <div class="frame" id="statement"></div>
</div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h;
  function Hook() {
    var f = VK.useFrame();
    return h(VK.SceneFrame, { frame: f, eyebrow: 'NGÀY 05 · THIẾT KẾ SẢN PHẨM AI', title: 'Cùng điều kiện, cùng kết quả?',
      overlay: h(VK.HookOverlay, { frame: f, question: 'Cùng một câu hỏi, AI trả lời\nhai cách khác nhau: đó có phải lỗi?' }) });
  }
  function Title() {
    var f = VK.useFrame();
    return h(VK.SceneFrame, { frame: f, header: false, overlay: h(VK.BrandTitle, { frame: f, eyebrow: 'AI & LLM Foundation · Ngày 1', title: 'Bên trong một LLM', icon: 'neural-net' }) });
  }
  function Section() {
    var f = VK.useFrame();
    return h(VK.SceneFrame, { frame: f, header: false, overlay: h(VK.SectionCard, { frame: f, number: 2, label: 'Transformer & Self-Attention', eyebrow: 'Phần 2', icon: 'layers' }) });
  }
  function Closing() {
    var f = VK.useFrame();
    return h(VK.SceneFrame, { frame: f, header: false, background: VK.C.bgAlt, overlay: h(VK.Statement, { frame: f, eyebrow: 'Trước khi thực hành', text: 'LLM dự đoán, Transformer giúp nó nhìn toàn cục, và mỗi token đều có giá.' }) });
  }
  VK.mountFrame('#hook', { scene: Hook, duration: 150, frame: 64 });
  VK.mountFrame('#title', { scene: Title, duration: 150, frame: 100 });
  VK.mountFrame('#section', { scene: Section, duration: 120, frame: 90 });
  VK.mountFrame('#statement', { scene: Closing, duration: 120, frame: 90 });
</script>
</body>
</html>
