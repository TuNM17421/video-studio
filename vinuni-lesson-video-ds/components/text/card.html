<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Text</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }

</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>

  function head(x, t) { return h(VK.SvgText, { x: x, y: 50, size: 20, weight: 700, anchor: 'start', color: C.red, letterSpacing: 2 }, t); }
  VK.mountCard('#root', {
    width: 1400, height: 440, frame: 0,
    render: function () {
      return h(VK.Fragment, null,
        head(40, 'SVGTEXT'),
        h(VK.SvgText, { x: 40, y: 130, size: 50, weight: 700, anchor: 'start' }, 'Tiêu đề 50'),
        h(VK.SvgText, { x: 40, y: 190, size: 24, weight: 600, anchor: 'start' }, 'Nội dung 24 · baseline = y'),
        h(VK.SvgText, { x: 40, y: 236, size: 21, weight: 600, anchor: 'start', color: C.textMuted }, 'Dòng phụ 21 · textMuted'),
        h(VK.SvgText, { x: 40, y: 282, size: 17, weight: 700, anchor: 'start', color: C.accent }, 'NHÃN MICRO 17'),
        h(VK.SvgText, { x: 40, y: 330, size: 22, weight: 600, anchor: 'start', family: VK.MONO }, 'read_course_document()'),
        head(560, 'MULTILINE'),
        h('rect', { x: 560, y: 90, width: 360, height: 170, rx: 22, fill: C.bgAlt, stroke: C.accent, strokeWidth: 3 }),
        h(VK.SvgText, { x: 584, y: 122, size: 17, weight: 700, anchor: 'start', color: C.accent }, 'THEO QUY TẮC'),
        h(VK.Multiline, { x: 740, y: 187, lines: ['CÔNG TẮC', 'đóng mạch'], firstWeight: 700 }),
        h(VK.SvgText, { x: 740, y: 300, size: 19, weight: 600, color: C.textMuted }, 'y = giữa khối · lh 33'),
        head(990, 'RICHTEXT'),
        h(VK.RichText, { x: 990, y: 150, anchor: 'start', size: 34, weight: 700, spans: [{ text: 'Token chọn: ' }, { text: 'mưa', color: C.red }] }),
        h(VK.RichText, { x: 990, y: 215, anchor: 'start', size: 22, weight: 600, spans: [{ text: 'Trời hôm nay thật nắng và ' }, { text: 'đẹp', color: C.red, weight: 700 }] }),
        h(VK.SvgText, { x: 990, y: 282, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, 'một từ đổi màu = điểm nhấn')
      );
    }
  });
</script>
