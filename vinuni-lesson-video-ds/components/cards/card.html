<!-- @dsCard group="Components" viewport="700x330" name="Cards · Card, GlassBox, GlassNode, IconBadge" subtitle="default · active (pulse) · red · dashed · muted · glassbox machine · editorial node · legacy badge" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Cards</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 330px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  function tag(x, y, t) { return h(VK.SvgText, { x: x, y: y, size: 19, weight: 700, anchor: 'start', color: C.textMuted, letterSpacing: 1 }, t); }
  function grid() {
    var cells = [];
    for (var r = 0; r < 3; r++) for (var c = 0; c < 5; c++) {
      var hot = (r + c * 2) % 4 === 0;
      cells.push(h('rect', { key: r + '-' + c, x: 90 + c * 52, y: 420 + r * 44, width: 40, height: 28, rx: 7, fill: hot ? C.redSoft : C.dotInactive, stroke: hot ? C.red : C.accent, strokeWidth: 2 }));
    }
    return cells;
  }
  VK.mountCard('#root', {
    width: 1400, height: 660, frame: 0,
    render: function () {
      return h(VK.Fragment, null,
        h(VK.Card, { x: 40, y: 40, w: 300, h: 140, label: 'YÊU CẦU', lines: ['BỨC THƯ', 'cần tóm tắt'] }),
        tag(40, 212, 'default'),
        h(VK.Card, { x: 375, y: 40, w: 300, h: 140, label: 'KẾT QUẢ', lines: ['ĐÈN SÁNG', 'đang nhận hạt'], active: 1 }),
        tag(375, 212, 'active = pulse()'),
        h(VK.Card, { x: 710, y: 40, w: 300, h: 140, accent: C.red, label: 'BẢN B', lines: ['ƯU TIÊN XỬ LÝ', 'trước cuối ngày'] }),
        tag(710, 212, 'accent = red'),
        h(VK.Card, { x: 1045, y: 40, w: 315, h: 140, label: 'GIẢ ĐỊNH', icon: 'document', lines: ['CHƯA CÓ', 'dữ liệu thật'], dashed: true }),
        tag(1045, 212, 'dashed · icon'),
        h(VK.GlassBox, { x: 40, y: 300, w: 560, h: 300, label: 'MÔ HÌNH NGÔN NGỮ LỚN', active: 0 },
          grid(),
          h(VK.SvgText, { x: 219, y: 395, size: 17, weight: 700, color: C.accentStrong }, 'THAM SỐ DẠNG SỐ'),
          h('path', { d: 'M 400 330 V 570', stroke: C.dotInactive, strokeWidth: 3 }),
          h(VK.MiniBar, { x: 425, y: 420, w: 140, value: 0.72, label: 'hoàn', accent: C.red }),
          h(VK.MiniBar, { x: 425, y: 480, w: 140, value: 0.32, label: 'xử' }),
          h(VK.MiniBar, { x: 425, y: 540, w: 140, value: 0.14, label: 'hỏi' })),
        tag(40, 636, 'GlassBox'),
        h(VK.GlassNode, { x: 790, y: 400, label: 'PIPELINE', subtitle: 'processing', icon: 'gear' }),
        h(VK.GlassNode, { x: 790, y: 560, w: 240, h: 110, label: 'SERVING', subtitle: 'model endpoint', tone: 'strong' }),
        tag(680, 636, 'GlassNode · editorial'),
        h(VK.Card, { x: 960, y: 300, w: 170, h: 110, lines: ['MUTED'], muted: 1 }),
        h(VK.IconBadge, { name: 'edit', x: 1255, y: 380, size: 120, color: C.red, label: 'Sinh văn bản' }),
        h(VK.IconBadge, { name: 'neural-net', x: 1045, y: 540, size: 110, color: C.accent, filled: true }),
        tag(1000, 636, 'IconBadge · legacy / nhãn phụ')
      );
    }
  });
</script>
</body>
</html>
