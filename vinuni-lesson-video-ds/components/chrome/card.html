<!-- @dsCard group="Components" viewport="700x270" name="SceneFrame · chrome" subtitle="center (canonical) and editorial (Day28) variants — watermark, footer, subtitle bar" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>SceneFrame · chrome</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 270px; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 12px 0; }
  .frame { position: relative; width: 332px; height: 187px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--color-dot-inactive); }
  .cap { margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--color-red); }
  .cap span { margin-left: 6px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--color-text-muted); }
</style>
</head>
<body>
<div class="grid">
  <div><div class="frame" id="a"></div><div class="cap">variant="center"<span>chuẩn · Day01–Day05</span></div></div>
  <div><div class="frame" id="b"></div><div class="cap">variant="editorial"<span>Day28 · bản đồ hệ thống</span></div></div>
</div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  function Center() {
    var f = VK.useFrame();
    return h(VK.SceneFrame, {
      frame: f, eyebrow: 'NGÀY 03 · TỪ MÔ HÌNH ĐẾN TÁC TỬ', title: 'Nhận thức và suy luận', tag: 'MINH HỌA',
      footer: { left: '02 / 06 · Agent gồm những khối nào?' }, caption: 'Mình gắn bốn nhóm việc với bốn tên trong sơ đồ.'
    },
      h(VK.Card, { x: 300, y: 380, w: 420, h: 170, label: 'NHẬN THỨC', lines: ['NHẬN THÔNG TIN', 'câu hỏi · tài liệu'], size: 28, lineHeight: 40 }),
      h(VK.Flow, { points: [{ x: 720, y: 465 }, { x: 1200, y: 465 }], progress: 1, color: C.red }),
      h(VK.Card, { x: 1200, y: 380, w: 420, h: 170, accent: C.red, label: 'SUY LUẬN', lines: ['CHỌN VIỆC TIẾP', 'hỏi lại mã lớp'], size: 28, lineHeight: 40, active: 0.6 }));
  }
  function Editorial() {
    return h(VK.SceneFrame, {
      frame: 40, variant: 'editorial', kicker: 'DAY 28 · INTEGRATION CONTROLS',
      title: 'Event đã nối data.', titleAccent: 'Còn hai rủi ro khác.', subtitle: 'GitOps reconcile desired state với actual state.'
    },
      h(VK.GlassNode, { x: 480, y: 560, label: 'GIT · DESIRED', subtitle: 'reviewed target', icon: 'document' }),
      h(VK.Flow, { points: [{ x: 600, y: 560 }, { x: 1080, y: 560 }], progress: 1 }),
      h(VK.ZoneLabel, { x: 840, y: 510, label: 'DESIRED' }),
      h(VK.GlassNode, { x: 1200, y: 560, label: 'CONTROLLER', subtitle: 'compare · reconcile', icon: 'gear', tone: 'strong' }),
      h(VK.GlassNode, { x: 1560, y: 800, label: 'ACTUAL STATE', subtitle: 'replicas = 1', icon: 'alert-bubble', tone: 'danger' }));
  }
  VK.mountFrame('#a', { scene: Center, duration: 1, frame: 0 });
  VK.mountFrame('#b', { scene: Editorial, duration: 1, frame: 0 });
</script>
</body>
</html>
