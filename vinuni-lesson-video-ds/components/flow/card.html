<!-- @dsCard group="Components" viewport="700x250" name="Flow · connectors & particles" subtitle="particle rides the drawn path, hides on card faces, one pulse per arrival; curves, labelled particle" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Flow</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 250px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  var A = { x: 40, y: 50, w: 260, h: 120 };
  var B = { x: 570, y: 50, w: 260, h: 120 };
  var D = { x: 1100, y: 50, w: 260, h: 120 };
  var curve = VK.sampleCubic({ x: 80, y: 420 }, { x: 420, y: 250 }, { x: 760, y: 470 }, { x: 1080, y: 330 });
  var lane = [{ x: 1120, y: 420 }, { x: 1360, y: 420 }];
  VK.mountCard('#root', {
    width: 1400, height: 500, duration: 150,
    render: function (f) {
      var t = VK.linearProgress(f, 20, 130);
      var p = VK.pointAtDistance(lane, t * VK.polylineLength(lane));
      return h(VK.Fragment, null,
        h(VK.Card, { x: A.x, y: A.y, w: A.w, h: A.h, label: 'NGUỒN', lines: ['DỮ LIỆU'], size: 26 }),
        h(VK.Flow, { points: [VK.anchor(A, 'right'), VK.anchor(B, 'left')], frame: f, start: 10, end: 55, hideIn: [A, B] }),
        h(VK.Card, { x: B.x, y: B.y, w: B.w, h: B.h, label: 'CỖ MÁY', lines: ['XỬ LÝ'], size: 26, active: VK.pulse(f, 55) }),
        h(VK.Flow, { points: [VK.anchor(B, 'right'), VK.anchor(D, 'left')], frame: f, start: 70, end: 115, color: C.red, hideIn: [B, D] }),
        h(VK.Card, { x: D.x, y: D.y, w: D.w, h: D.h, accent: C.red, label: 'ĐẦU RA', lines: ['ĐÃ CHỌN'], size: 26, active: VK.pulse(f, 115) }),
        h(VK.Flow, { points: curve, frame: f, start: 0, end: 120, strokeWidth: 5 }),
        h(VK.SvgText, { x: 80, y: 470, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, 'sampleCubic() → cùng polyline cho nét & hạt'),
        h(VK.StaticPath, { points: lane, color: C.dotInactive, strokeWidth: 5 }),
        t > 0 && t < 1 ? h(VK.Particle, { x: p.x, y: p.y, color: C.red, label: 'v-new' }) : null,
        h(VK.SvgText, { x: 1120, y: 470, size: 19, weight: 600, anchor: 'start', color: C.textMuted }, 'Particle + nhãn')
      );
    }
  });
</script>
</body>
</html>
