<!doctype html>
<html lang="vi">
<head>

<title>Mẫu · Griffin kể năm bước làm video</title>
<link rel="stylesheet" href="../../../../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: var(--vu-blue-900); }

<body>
<div id="root"></div>
<script src="../../../../dist/vk.js"></script>
