<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>LEXCE slide-size QA</title>
<style>html,body,#root{margin:0;width:1200px;height:460px;background:#f3f8ff}</style></head>
<body><div id="root"></div><script src="../../../dist/vk.js"></script><script>
const h=VK.h;
const samples=[['wave','Vẫy trái'],['pointUp','Gậy chỉ'],['read','Đọc sách'],['sketch','Bản vẽ']];
VK.mountCard('#root',{width:1200,height:460,duration:1,render:function(){return h(VK.Fragment,null,
  h('rect',{width:1200,height:460,fill:'#f3f8ff'}),
  h('text',{x:30,y:39,fontSize:23,fontWeight:800,fontFamily:'Arial,sans-serif',fill:'#194585'},'LEXCE · cỡ slide 300 px'),
  samples.map(function(sample,i){const x=20+i*295;return h(VK.Fragment,{key:sample[0]},
    h('rect',{x:x,y:61,width:280,height:373,rx:22,fill:'#fff',stroke:'#d5e5fa',strokeWidth:2}),
    h(VK.MascotRevamp,{x:x+20,y:74,size:300,frame:5,pose:sample[0],emotion:'idle'}),
    h('text',{x:x+140,y:412,textAnchor:'middle',fontSize:20,fontWeight:700,fontFamily:'Arial,sans-serif',fill:'#194585'},sample[1]));
  })
);}});
</script></body></html>
