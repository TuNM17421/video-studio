<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>DialogueCard — thẻ hội thoại</title>
<link rel="stylesheet" href="../../../styles.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--color-bg); font-family: var(--font-sans); padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { font-size: 14px; color: #4a4a4a; margin: 0 0 18px; max-width: 900px; line-height: 1.6; }
</style>
</head>
<body>
<h1>DialogueCard</h1>
<p>Ba nhân vật đối đáp. Mỗi chữ hiện đúng frame nó được nói — ở video thật, các mốc này đến từ
<code>spokenWords(n)</code>, tức mốc từng từ đo được từ bản thu; trang này mô phỏng bằng nhịp đều.
Mỗi nhân vật một khuôn mặt, một màu và một phía cố định — tất cả khai trong <code>voices.json</code>.</p>
<div id="root"></div>
<script src="../../../dist/vk.js"></script>
<script>
  var h = VK.h;
  // Nhịp đều thay cho mốc thật, chỉ để xem hình: chữ thứ i của câu bắt đầu ở frame `from + i * per`.
  function say(text, from, per) {
    return text.split(/\s+/).map(function (w, i) { return { text: w, frame: from + i * (per || 7) }; });
  }
  var FACE = 'https://pub-75f38a18d7494e158433fd71f020ea01.r2.dev/avatars/';
  VK.mountCard('#root', {
    width: 1920, height: 1080, duration: 560,
    render: function (f) {
      return h(VK.Fragment, null,
        h(VK.DialogueCard, {
          x: 280, y: 260, w: 760, side: 'left', speaker: 'Tới', tone: 'accent', avatar: FACE + 'toi_2.jpg', frame: f,
          words: say('Gần như mọi dự án trí tuệ nhân tạo ở các công ty đều bắt đầu bằng một câu như vậy.', 10),
        }),
        f > 150 && h(VK.DialogueCard, {
          x: 860, y: 540, w: 760, side: 'right', speaker: 'Tú', tone: 'red', avatar: FACE + 'tu_2.jpg', frame: f,
          words: say('Nhưng em làm nhân sự, bài này có phải cho em không ạ?', 170),
        }),
        f > 300 && h(VK.DialogueCard, {
          x: 280, y: 810, w: 860, side: 'left', speaker: 'Mai Anh', tone: 'strong', avatar: FACE + 'mai_anh_2.jpg', frame: f,
          words: say('Hồi đầu mình cũng hỏi y hệt câu đó, mình cũng không phải dân kỹ thuật đâu.', 320),
        })
      );
    }
  });
</script>
</body>
</html>
