<!-- @dsCard group="Spacing" viewport="700x250" name="Radius, stroke & dash" subtitle="Corner radii, stroke widths by role, dash patterns" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Radius, stroke & dash</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 250px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
  svg { display: block; width: 700px; height: 250px; }
</style>
</head>
<body>
<svg viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, sans-serif">
  <g font-size="22" font-weight="700" fill="#c72127" letter-spacing="2">
    <text x="30" y="46">BO GÓC</text>
    <text x="30" y="246">NÉT</text>
    <text x="30" y="406">NÉT ĐỨT</text>
  </g>
  <!-- radius -->
  <g fill="#f2f7fc" stroke="#1d6199" stroke-width="3">
    <rect x="30" y="70" width="120" height="84" rx="9" />
    <rect x="200" y="70" width="120" height="84" rx="14" />
    <rect x="370" y="70" width="120" height="84" rx="18" />
    <rect x="540" y="70" width="120" height="84" rx="22" />
    <rect x="710" y="70" width="120" height="84" rx="30" />
    <rect x="880" y="70" width="120" height="84" rx="32" fill="none" stroke="#c72127" stroke-width="4" stroke-dasharray="15 12" />
    <rect x="1050" y="86" width="190" height="52" rx="26" fill="#ffffff" stroke-width="2.5" />
  </g>
  <g font-size="19" font-weight="600" fill="#4a4a4a" text-anchor="middle">
    <text x="90" y="186">9 · bar</text>
    <text x="260" y="186">14 · chip</text>
    <text x="430" y="186">18 · thẻ HTML</text>
    <text x="600" y="186">22 · thẻ SVG</text>
    <text x="770" y="186">30 · glassbox</text>
    <text x="940" y="186">32 · enclosure</text>
    <text x="1145" y="186">pill · 999</text>
  </g>
  <!-- stroke -->
  <g stroke-linecap="round">
    <path d="M 40 290 H 200" stroke="#e0edf8" stroke-width="2" />
    <path d="M 250 290 H 410" stroke="#1d6199" stroke-width="2.5" />
    <path d="M 460 290 H 620" stroke="#1d6199" stroke-width="3" />
    <path d="M 670 290 H 830" stroke="#1d6199" stroke-width="4" />
    <path d="M 880 290 H 1040" stroke="#1d6199" stroke-width="5" />
    <path d="M 1090 290 H 1250" stroke="#c72127" stroke-width="8" />
  </g>
  <g font-size="19" font-weight="600" fill="#4a4a4a" text-anchor="middle">
    <text x="120" y="336">2 · hairline, tag</text>
    <text x="330" y="336">2.5 · pill</text>
    <text x="540" y="336">3 · thẻ, glassbox</text>
    <text x="750" y="336">4 · ngoặc</text>
    <text x="960" y="336">5 · flow, active</text>
    <text x="1170" y="336">8 · check / cross</text>
  </g>
  <!-- dashes -->
  <g stroke-linecap="round" fill="none">
    <path d="M 40 440 H 400" stroke="#1d6199" stroke-width="3" stroke-dasharray="12 10" />
    <path d="M 480 440 H 840" stroke="#1d6199" stroke-width="5" stroke-dasharray="13 11" />
    <path d="M 920 440 H 1280" stroke="#c72127" stroke-width="4" stroke-dasharray="15 12" />
  </g>
  <g font-size="19" font-weight="600" fill="#4a4a4a" text-anchor="middle">
    <text x="220" y="482">12 / 10 · thẻ giả định, đang chờ</text>
    <text x="660" y="482">13 / 11 · flow tuỳ chọn</text>
    <text x="1100" y="482">15 / 12 · enclosure nhóm</text>
  </g>
</svg>
<script>
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { document.documentElement.dataset.vkReady = '1'; });
</script>
</body>
</html>
