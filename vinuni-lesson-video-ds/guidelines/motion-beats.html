<!-- @dsCard group="Motion" viewport="700x300" name="Motion beats" subtitle="appear 24 f · pulse 54 f · linear flow + particle · hook underline — 30 fps, looping" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Motion beats</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 300px; overflow: hidden; background: var(--color-bg); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../dist/vk.js"></script>
<script>
  var h = VK.h, C = VK.C;
  var ROW = [70, 210, 350, 490];
  function label(y, name, spec) {
    return h(VK.Fragment, null,
      h(VK.SvgText, { x: 30, y: y - 6, size: 26, weight: 700, anchor: 'start', color: C.red, letterSpacing: 1.5 }, name),
      h(VK.SvgText, { x: 30, y: y + 28, size: 20, weight: 600, anchor: 'start', color: C.textMuted }, spec));
  }
  VK.mountCard('#root', {
    width: 1400, height: 600, duration: 150,
    render: function (f) {
      var hook = VK.interpolate(f, [30, 58], [0, 368], Object.assign({}, VK.CLAMP, { easing: VK.EASE.draw }));
      return h(VK.Fragment, null,
        label(ROW[0], 'APPEAR', '24 f · ease (0.16, 1, 0.3, 1)'),
        h('g', { transform: 'translate(0 ' + (1 - VK.appear(f, 10)) * 18 + ')' },
          h(VK.Card, { x: 470, y: ROW[0] - 44, w: 330, h: 88, lines: ['THẺ XUẤT HIỆN'], size: 24, opacity: VK.appear(f, 10) })),
        label(ROW[1], 'PULSE', '54 f · 0 → 1 (32 %) → 0'),
        h(VK.Card, { x: 470, y: ROW[1] - 44, w: 330, h: 88, lines: ['THẺ NHẬN HẠT'], size: 24, active: VK.pulse(f, 40) }),
        label(ROW[2], 'FLOW', 'tuyến tính · hạt + mũi tên 14 f'),
        h(VK.Flow, { points: [{ x: 470, y: ROW[2] }, { x: 1300, y: ROW[2] }], frame: f, start: 20, end: 100 }),
        label(ROW[3], 'HOOK DRAW', '30 → 58 f · in-out'),
        h('rect', { x: 470, y: ROW[3] - 7, width: hook, height: 14, rx: 7, fill: C.red }),
        h('path', { d: 'M 890 ' + (ROW[0] - 50) + ' V ' + (ROW[1] + 50), stroke: C.dotInactive, strokeWidth: 3 }),
        h(VK.SvgText, { x: 1110, y: ROW[0] + 8, size: 22, weight: 700, color: C.accentStrong }, 'frame ' + String(f).padStart(3, '0')),
        h(VK.MiniBar, { x: 960, y: ROW[1] - 10, w: 300, value: f / 149, label: 'tiến trình 150 f' })
      );
    }
  });
</script>
</body>
</html>
