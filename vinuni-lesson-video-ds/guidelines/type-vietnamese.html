<!-- @dsCard group="Type" viewport="700x230" name="Montserrat · tiếng Việt" subtitle="Weights 500 / 600 / 700, full Vietnamese diacritics, numbers and symbols" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=700" />
<title>Montserrat · tiếng Việt</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { width: 700px; height: 230px; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 16px 18px; }
  .aa { font-size: 96px; font-weight: 700; line-height: 1; color: var(--color-text); }
  .fam { margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--color-red); text-transform: uppercase; }
  .fam2 { margin-top: 3px; font-size: 10.5px; font-weight: 600; color: var(--color-text-muted); }
  .w { display: flex; align-items: baseline; gap: 10px; font-size: 21px; line-height: 1.35; white-space: nowrap; }
  .w small { width: 30px; font-size: 10.5px; font-weight: 700; color: var(--color-accent); }
  .dia { margin-top: 8px; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  .sym { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--color-text-muted); }
  .sym b { color: var(--color-red); }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="aa">Aa</div>
    <div class="fam">Montserrat</div>
    <div class="fam2">500 · 600 · 700 · subset vietnamese</div>
  </div>
  <div>
    <div class="w" style="font-weight:500"><small>500</small>Mô hình ngôn ngữ lớn học từ dữ liệu</div>
    <div class="w" style="font-weight:600"><small>600</small>Mô hình ngôn ngữ lớn học từ dữ liệu</div>
    <div class="w" style="font-weight:700"><small>700</small>Mô hình ngôn ngữ lớn học từ dữ liệu</div>
    <div class="dia">ă â đ ê ô ơ ư · à á ả ã ạ · Ữ Ặ Ẩ Ỹ Ộ Ở · Tiếng Việt</div>
    <div class="sym">8.192 token · 50% · 1,2 tỷ · A <b>→</b> B · “trích dẫn” · 21:00 · MINH HỌA</div>
  </div>
</div>
<script>
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { document.documentElement.dataset.vkReady = '1'; });
</script>
</body>
</html>
