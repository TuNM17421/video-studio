<!doctype html>
<!-- Local preview helper (not a design-system card): every card of this design system on one page.
     Serve the folder over HTTP first — fonts do not load from file:// URLs:
     python3 -m http.server 8765 --directory vinuni-lesson-video-ds  →  http://localhost:8765/gallery.html -->
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VinUni Lesson Video — gallery</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { margin: 0; background: var(--color-bg-alt); color: var(--color-text); font-family: var(--font-sans); }
  header { padding: 28px 32px 4px; }
  header .eb { color: var(--color-red); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  header h1 { margin: 8px 0 6px; font-size: 30px; }
  header p { margin: 0; color: var(--color-text-muted); font-weight: 600; font-size: 14px; }
  header a { color: var(--color-accent); }
  h2 { margin: 30px 32px 12px; color: var(--color-red); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; padding: 0 32px; }
  .card { background: var(--color-bg); border: 1px solid var(--color-dot-inactive); border-radius: 12px; overflow: hidden; }
  .frame { position: relative; overflow: hidden; }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  .name { padding: 8px 12px; border-top: 1px solid var(--color-dot-inactive); font-size: 12px; font-weight: 700; }
  .name span { color: var(--color-text-muted); font-weight: 600; }
  footer { height: 40px; }
</style>
</head>
<body>
<header>
  <div class="eb">VinUni · AI in Action 20K</div>
  <h1>Lesson Video — design system gallery</h1>
  <p>Mọi card của design system trên một trang. Scene kit đầy đủ: <a href="ui_kits/lesson-video/index.html">ui_kits/lesson-video/index.html</a></p>
</header>
<div id="groups"></div>
<footer></footer>
<script>
  var GROUPS = [
    ['Colors', [['guidelines/colors-palette.html', 700, 300], ['guidelines/colors-roles.html', 700, 250]]],
    ['Type', [['guidelines/type-scale.html', 700, 400], ['guidelines/type-vietnamese.html', 700, 230]]],
    ['Spacing', [['guidelines/layout-canvas.html', 700, 394], ['guidelines/shape-stroke.html', 700, 250]]],
    ['Motion', [['guidelines/motion-beats.html', 700, 300]]],
    ['Brand', [['guidelines/brand-scene-chrome.html', 700, 394]]],
    ['Iconography', [['components/icons/card.html', 700, 300]]],
    ['Components', [
      ['components/chrome/card.html', 700, 270], ['components/text/card.html', 700, 220], ['components/cards/card.html', 700, 330],
      ['components/labels/card.html', 700, 220], ['components/flow/card.html', 700, 250], ['components/marks/card.html', 700, 240],
      ['components/data/card.html', 700, 360], ['components/beats/card.html', 700, 394],
      ['components/roadmap/card.html', 700, 300], ['components/figures/card.html', 700, 300],
      ['components/mascot/card.html', 700, 400]
    ]],
    ['Lesson Video', [['ui_kits/lesson-video/index.html', 1280, 720, 0.75]]],
    ['Video mẫu', [['ui_kits/lesson-video/videos/n2-00-gioi-thieu-ngay-2/card.html', 1280, 720, 0.5]]],
    ['Scenes', ['hook-question', 'brand-title', 'section-card', 'flow-compare', 'glassbox-model', 'next-token', 'pipeline-guard', 'recap-rail', 'check-question', 'editorial-platform']
      .map(function (id) { return ['ui_kits/lesson-video/cards/' + id + '.html', 1280, 720, 0.5]; })]
  ];
  var root = document.getElementById('groups');
  GROUPS.forEach(function (g) {
    var h2 = document.createElement('h2');
    h2.textContent = g[0];
    root.appendChild(h2);
    var grid = document.createElement('div');
    grid.className = 'grid';
    g[1].forEach(function (c) {
      var scale = c[3] || 1;
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="frame" style="width:' + c[1] * scale + 'px;height:' + c[2] * scale + 'px">' +
        '<iframe loading="lazy" src="' + c[0] + '" width="' + c[1] + '" height="' + c[2] + '" style="transform:scale(' + scale + ')"></iframe></div>' +
        '<div class="name">' + c[0].split('/').slice(-2).join('/') + ' <span>· ' + c[1] + '×' + c[2] + '</span></div>';
      grid.appendChild(card);
    });
    root.appendChild(grid);
  });
</script>
</body>
</html>
